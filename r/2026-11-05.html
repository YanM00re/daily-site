  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.6}

.rule{height:1px;background:var(--line);margin:34px 0}
.meta{color:var(--ink3);font-size:14px;margin-top:52px;border-top:1px solid var(--line);padding-top:16px}
.badge{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;

.badge.done{color:var(--green);border-color:rgba(134,180,106,.4)}
.badge.doing{color:var(--gold);border-color:rgba(216,166,80,.4)}
.task{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.task .proj{color:var(--ink3);font-size:13px;letter-spacing:.04em;text-transform:uppercase;min-width:110px}
.task .t{flex:1}
