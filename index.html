<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Обзор дел</title>
<style>
:root{
  --bg:#f2f2f7; --panel:#ffffff; --ink:#1c1c1e; --ink2:#3c3c43;
  --ink3:#8e8e93; --line:#e3e3e8; --accent:#0a84ff; --ok:#34c759;
  --gold:#ff9f0a; --radius:12px; --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; --head:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:44px 22px 90px}
h1{font-family:var(--head);font-size:34px;line-height:1.15;margin:0 0 6px;letter-spacing:.01em}
h2{font-family:var(--head);font-size:22px;margin:36px 0 12px}
h3{font-family:var(--head);font-size:18px;margin:24px 0 8px}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--accent) 35%, transparent)}
a:hover{border-bottom-color:var(--accent)}
.date{color:var(--ink3);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.lead{color:var(--ink2);margin:0 0 26px}
ul{padding-left:22px;margin:10px 0}
li{margin:6px 0}
code{background:var(--panel);padding:1px 6px;border-radius:5px;font-size:15px}
.rule{height:1px;background:var(--line);margin:32px 0}
.meta{color:var(--ink3);font-size:14px;margin-top:48px;border-top:1px solid var(--line);padding-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--radius) + 4px);padding:6px 18px;margin:14px 0}
.task{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task .proj{color:var(--ink3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;min-width:104px}
.task .t{flex:1}
.badge{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
padding:2px 8px;border-radius:9px;border:1px solid var(--line);color:var(--ink3);margin-left:8px;vertical-align:1px}
.badge.done{color:var(--ok);border-color:color-mix(in srgb, var(--ok) 45%, transparent)}
.badge.doing{color:var(--gold);border-color:color-mix(in srgb, var(--gold) 45%, transparent)}
</style>
</head><body><div class="wrap">

<div class="date">2026-11-05</div>
<h1>Текущий обзор</h1>
<p class="lead">Что в работе, что закрыто и как шёл день. Страница собирается автоматически.</p>

<h2>В работе</h2>
<div class="card"><p class="lead">Публичных дел сейчас нет.</p></div>

<h2>Закрыто</h2>
<div class="card"><p class="lead">Пока пусто.</p></div>

<h2>Отчёты по дням</h2><p><a href="r/2026-11-05.html">2026-11-05</a></p>

<div class="rule"></div>
<p class="meta">Собрано 05.11.2026 13:23. Здесь только то, что отмечено как публичное.</p>

</div></body></html>
